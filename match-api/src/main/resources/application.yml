spring:
  application:
    name: match-api

  # Redis
  data:
    redis:
      host: localhost
      port: 6379

# Redis Stream 설정
redis:
  stream:
    orderbook:
      key-prefix: "orderbook:stream:"
      consumer-group-name: "matching-engine"
      block-timeout: 5s
      batch-size: 10

# Trade API 설정 (Consul 서비스 디스커버리)
trade:
  api:
    base-url: http://trade-api

# KIS API 설정 (실전투자)
kis:
  websocket:
    url: ws://ops.koreainvestment.com:21000
    app-key: key
    app-secret: secret
  auth:
    base-url: https://openapi.koreainvestment.com:9443